services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: app
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: web
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    depends_on:
      - app
    networks:
      - default
      - caddy
    labels:
      caddy: "${PROXY_HOSTS}"
      caddy.reverse_proxy: "{{upstreams 80}}"
    restart: unless-stopped

networks:
  default: {}
  caddy:
    name: ${PROXY_NETWORK:-caddy}
    external: true

volumes:
  db-data:
